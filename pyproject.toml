[project]
name = "enterprise-document-intelligence"
version = "0.1.0"
description = "AI-Powered Enterprise Document Intelligence & Decision Assistant"
requires-python = ">=3.11,<3.13"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "sqlalchemy>=2.0,<3.0",
    "psycopg[binary]>=3.2,<4.0",
    "alembic>=1.20,<2.0",
    "python-dotenv>=1.0,<2.0",
    "pydantic-settings>=2.0,<3.0",
    "PyJWT>=2.10,<3.0",
    "pwdlib[argon2]>=0.2,<1.0",
    "python-multipart>=0.0.9,<1.0",
    "pymupdf>=1.24,<2.0",
    "python-docx>=1.1,<2.0",
    "sentence-transformers>=5.1,<6.0",
    "faiss-cpu>=1.15,<2.0",
    "langchain",
    "langchain-ollama",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[project.optional-dependencies]
dev = [
    "pytest>=8,<9",
]