services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: enterprise-document-intelligence-api
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - ./app:/app/app
    command: >
      uvicorn app.main:app
      --host 0.0.0.0
      --port 8000
      --reload